name: CI (test coverage)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    strategy:
      fail-fast: false
      matrix:
        timezone:
          - "America/New_York"
          - "Europe/London"
          - "Asia/Tokyo"
          - "UTC"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set timezone to ${{ matrix.timezone }}
        run: |
          sudo timedatectl set-timezone ${{ matrix.timezone }}
          date

      - name: Run tests in ${{ matrix.timezone }} timezone
        run: |
          pnpm test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: ${{ matrix.timezone == 'UTC' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: still-forest/proper-date.js
